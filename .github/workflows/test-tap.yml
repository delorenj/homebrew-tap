name: Test tap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Formula/**
      - Casks/**
      - .github/workflows/test-tap.yml
  pull_request:
    paths:
      - Formula/**
      - Casks/**
      - .github/workflows/test-tap.yml

permissions:
  contents: read

jobs:
  install:
    name: Homebrew install (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting image Python links on Intel
        if: matrix.runner == 'macos-15-intel'
        run: |
          # The runner image prelinks python.org's 3.13 into Homebrew's bin.
          # Inspect and remove only those symlinks; leave every other tool alone.
          for name in idle3.13 pip3.13 pydoc3.13 python3.13 python3.13-config; do
            path="/usr/local/bin/$name"
            if [ -L "$path" ]; then
              target="$(readlink "$path")"
              printf 'Inspecting runner-image symlink: %s -> %s\n' "$path" "$target"
              case "$target" in
                *Library/Frameworks/Python.framework/Versions/3.13/bin/*)
                  printf 'Removing runner-image symlink: %s -> %s\n' "$path" "$target"
                  rm "$path"
                  ;;
              esac
            fi
          done
      - name: Install and test Vinyl client
        run: |
          brew tap delorenj/tap "$GITHUB_WORKSPACE"
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1 \
            brew install --build-from-source delorenj/tap/vinyl-client
          HOMEBREW_NO_AUTO_UPDATE=1 brew test delorenj/tap/vinyl-client

  cask:
    name: HeyMa cask (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      # `brew audit --online` queries the GitHub API; shared runner IPs exhaust
      # the 60/hour anonymous limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Tap this checkout
        run: |
          brew tap delorenj/tap "$GITHUB_WORKSPACE"
          # Newer Homebrew refuses to load non-official taps for style/audit/info
          # until trusted; installing by full name trusts the item implicitly.
          if brew trust --help >/dev/null 2>&1; then brew trust --tap delorenj/tap; fi
      - name: Style and audit
        run: |
          brew style --cask delorenj/tap/heyma
          brew audit --cask --online delorenj/tap/heyma
      - name: Install
        run: brew install --cask delorenj/tap/heyma
      - name: Verify the installed bundle
        run: |
          app=/Applications/HeyMa.app
          test -d "$app"
          cask_version="$(brew info --cask --json=v2 delorenj/tap/heyma | jq -r '.casks[0].version')"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = sh.delo.heyma
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$cask_version"
          archs="$(lipo -archs "$app/Contents/MacOS/HeyMa")"
          case "$archs" in *arm64*) ;; *) echo "missing arm64: $archs"; exit 1 ;; esac
          case "$archs" in *x86_64*) ;; *) echo "missing x86_64: $archs"; exit 1 ;; esac
          codesign --verify --strict --deep "$app"
          if xattr -p com.apple.quarantine "$app" 2>/dev/null; then
            echo "quarantine attribute survived postflight"; exit 1
          fi
      - name: Launch smoke test (no client installed)
        run: |
          /Applications/HeyMa.app/Contents/MacOS/HeyMa --background &
          pid=$!
          sleep 8
          kill -0 "$pid"
          kill "$pid"
      - name: Uninstall
        run: |
          brew uninstall --cask delorenj/tap/heyma
          test ! -e /Applications/HeyMa.app

  server:
    name: vinyl-server formula (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      # `brew audit --online` queries the GitHub API; shared runner IPs exhaust
      # the 60/hour anonymous limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting image Python links on Intel
        if: matrix.runner == 'macos-15-intel'
        run: |
          # The runner image prelinks python.org's 3.13 into Homebrew's bin.
          # Inspect and remove only those symlinks; leave every other tool alone.
          for name in idle3.13 pip3.13 pydoc3.13 python3.13 python3.13-config; do
            path="/usr/local/bin/$name"
            if [ -L "$path" ]; then
              target="$(readlink "$path")"
              printf 'Inspecting runner-image symlink: %s -> %s\n' "$path" "$target"
              case "$target" in
                *Library/Frameworks/Python.framework/Versions/3.13/bin/*)
                  printf 'Removing runner-image symlink: %s -> %s\n' "$path" "$target"
                  rm "$path"
                  ;;
              esac
            fi
          done
      - name: Tap this checkout
        run: |
          brew tap delorenj/tap "$GITHUB_WORKSPACE"
          # Newer Homebrew refuses to load non-official taps for style/audit/info
          # until trusted; installing by full name trusts the item implicitly.
          if brew trust --help >/dev/null 2>&1; then brew trust --tap delorenj/tap; fi
      - name: Style and audit
        run: |
          brew style delorenj/tap/vinyl-server
          # Audit resolves python@3.13 through the API; with the API off an
          # untapped homebrew/core on the arm64 image fails the dependency lookup.
          env -u HOMEBREW_NO_INSTALL_FROM_API \
            brew audit --strict --online delorenj/tap/vinyl-server
      - name: Reject a client payload (negative install)
        run: |
          tap_formulae="$(brew --repository delorenj/tap)/Formula"
          wrong="$tap_formulae/vinyl-server-wrong-payload.rb"
          trap 'rm -f "$wrong"' EXIT
          # Same formula, but pinned to the client archive (it carries CLIENT_ONLY).
          sed -E \
            -e 's/^class VinylServer </class VinylServerWrongPayload </' \
            -e 's|^  url ".*vinyl-server_0\.5\.0_macos\.tar\.gz"|  url "https://github.com/delorenj/vinyl-client-releases/releases/download/v0.4.3/vinyl-client_0.4.3_macos.tar.gz"|' \
            -e 's/^  sha256 "[0-9a-f]+"/  sha256 "fe678d8ec0454359f5e6b452341586ec62d8ffed300f306061991eb054960ff5"/' \
            "$GITHUB_WORKSPACE/Formula/vinyl-server.rb" > "$wrong"
          grep -q 'class VinylServerWrongPayload' "$wrong"
          grep -q 'vinyl-client_0.4.3_macos.tar.gz' "$wrong"
          grep -q 'fe678d8ec0454359f5e6b452341586ec62d8ffed300f306061991eb054960ff5' "$wrong"
          if brew install --build-from-source delorenj/tap/vinyl-server-wrong-payload > wrong.log 2>&1; then
            cat wrong.log
            echo "a client payload installed as vinyl-server"; exit 1
          fi
          cat wrong.log
          grep -q 'is not a Vinyl server payload' wrong.log
          rm -f "$wrong"
          echo "client payload refused as expected"
      - name: Install
        run: brew install --build-from-source delorenj/tap/vinyl-server
      - name: Verify the keg
        run: |
          prefix="$(brew --prefix delorenj/tap/vinyl-server)"
          test "$(ls "$prefix/bin")" = "vinyl-server"
          test -x "$prefix/libexec/venv/bin/python"
          "$prefix/libexec/venv/bin/python" -c 'import sys; assert sys.version_info[:2] == (3, 13), sys.version'
          test -f "$prefix/libexec/SERVER"
          test ! -e "$prefix/libexec/CLIENT_ONLY"
          test -x "$prefix/libexec/bin/download-model"
          "$prefix/libexec/venv/bin/python" -m pip list --format=freeze
          brew info delorenj/tap/vinyl-server | grep -F 'vinyl-server setup'
          brew info delorenj/tap/vinyl-server | grep -F '127.0.0.1:7733'
          brew info delorenj/tap/vinyl-server | grep -F 'vinyl setup --server 127.0.0.1:7733'
      - name: Test
        run: brew test --verbose delorenj/tap/vinyl-server
      - name: Check the service definition
        run: |
          # The keg carries no plist until `brew services start`, which this job
          # never runs. Render the formula's service block the way brew would.
          plist="$RUNNER_TEMP/sh.delo.vinyl.server.plist"
          brew ruby -e 'puts Formulary.factory("delorenj/tap/vinyl-server").service.to_plist' > "$plist"
          plutil -p "$plist"
          label="$(plutil -extract Label raw -o - "$plist")"
          echo "Label: $label"
          test "$label" = sh.delo.vinyl.server
          args="$(plutil -extract ProgramArguments json -o - "$plist" | jq -r 'join(" ")')"
          echo "ProgramArguments: $args"
          case "$args" in
            *"vinyl-server serve --host 127.0.0.1 --port 7733") ;;
            *) echo "unexpected ProgramArguments"; exit 1 ;;
          esac
          logpath="$(plutil -extract StandardOutPath raw -o - "$plist")"
          echo "StandardOutPath: $logpath"
          case "$logpath" in
            */var/log/vinyl-server.log) ;;
            *) echo "unexpected log path"; exit 1 ;;
          esac
      - name: Reinstall keeps the token and models
        run: |
          # Stand-ins in the real HOME: a token and a model marker. Nothing is
          # downloaded and the service is never started.
          token="$HOME/.config/vinyl/server.token"
          marker="$HOME/audio/models/parakeet-tdt-0.6b-v3-gguf/MODEL-MARKER"
          mkdir -p "$(dirname "$token")" "$(dirname "$marker")"
          printf 'fake-token-%s\n' "0123456789abcdef0123456789abcdef" > "$token"
          chmod 600 "$token"
          printf 'fake model marker\n' > "$marker"
          before="$(shasum -a 256 "$token" "$marker")"
          brew reinstall --build-from-source delorenj/tap/vinyl-server
          after="$(shasum -a 256 "$token" "$marker")"
          printf 'before:\n%s\nafter:\n%s\n' "$before" "$after"
          test "$before" = "$after"
          echo "token and model marker survived reinstall"
          rm -f "$token" "$marker"
      - name: Uninstall
        run: brew uninstall delorenj/tap/vinyl-server
